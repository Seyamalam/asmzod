name: ci
on: [push, pull_request]
jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install
      - run: make -C asm
      - run: npx tsc --noEmit
      - run: bun test
      - run: AZ_ENGINE=portable bun test
      - run: node --test node/node.test.mjs
      - run: bash scripts/asmlint.sh
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install
      # x86_64/arm64 linux has no native build — verify portable path
      - run: AZ_ENGINE=portable bun test
      - run: make ci || true
  workerd:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun add -D wrangler
      - run: ./scripts/workerd.sh
